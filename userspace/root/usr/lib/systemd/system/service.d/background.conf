# Every service but the app's, which mask this with a background.conf of their own: a drop-in
# comes after the unit file, so the unit can't just undo it.
# Files a service leaves in /dev/shm or /run stay charged to it after it dies, and without this
# they pinned the whole background at its limit. Real services use ~20-30 MB
[Service]
MemoryMax=128M
