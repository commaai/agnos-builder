[Service]
ExecStartPre=
ExecStartPre=/bin/mkdir -p /data/etc/ssh/
ExecStartPre=/usr/bin/ssh-keygen -A -f /data
ExecStartPre=/usr/sbin/sshd -t
# Sessions stay in this unit's memory group now that logind doesn't move them to their own: give
# them the app's memory, and the empty background.conf here drops the background's 128M cap.
# CPU is separate: the listener stays in the background, see /usr/comma/run_in_app_group.sh
Slice=app.slice
