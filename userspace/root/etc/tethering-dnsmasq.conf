# dnsmasq for the hotspot (tethering-dnsmasq.service): DHCP for clients, DNS forwarded to systemd-resolved
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-range=192.168.43.10,192.168.43.254,1h
dhcp-option=option:router,192.168.43.1
dhcp-leasefile=/run/tethering.leases
no-resolv
server=127.0.0.53
user=nobody
group=nogroup
