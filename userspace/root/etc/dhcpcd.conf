# AGNOS: dhcpcd only does DHCPv4, on wlan0 (dhcpcd-wlan0.service; wpa_supplicant owns association and roaming)
# and wired Ethernet (dhcpcd-eth.service)

# no udev on AGNOS
nodev

# Ethernet's default route beats Wi-Fi's (metric 600, below), and both beat LTE (ppp0, modem.py), also while roaming
metric 100

# IPv4 only, like the ipv6.method=ignore NM connections openpilot creates
ipv4only
noipv4ll

# connect speed: no random 0-1s start delay, no RFC 5227 duplicate address probe,
# rapid commit when the server offers it
nodelay
noarp
option rapid_commit
option domain_name_servers, domain_name, domain_search, interface_mtu, classless_static_routes
require dhcp_server_identifier
hostname
clientid

# keep trying for a lease, however long it takes
timeout 0

# DNS goes to systemd-resolved through our own hook, nothing else is touched
nohook resolv.conf, hostname, ntp.conf, timesyncd.conf

interface wlan0
metric 600
