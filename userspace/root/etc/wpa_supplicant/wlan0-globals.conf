# AGNOS: wpa_supplicant-wlan0.service reads this after the saved networks (-I), so these win over whatever
# SAVE_CONFIG copied into /data/etc/wpa_supplicant/wlan0.conf
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
# openpilot saves networks with SAVE_CONFIG
update_config=1
p2p_disabled=1
# PMF when the AP supports it
pmf=1
# no bgscan: the firmware roams between APs (FastRoamEnabled in WCNSS_qcom_cfg.ini), so wpa_supplicant never runs it
# connect straight from scan results up to 30s old (the settings UI scans every 5s) instead of rescanning
scan_res_valid_for_connect=30
