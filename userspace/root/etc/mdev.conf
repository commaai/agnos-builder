# Common permissions stay in mdev; only aliases and sysfs attributes need Python.
null|zero|full|random|urandom 0:0 0666
console 0:tty 0600
ptmx|tty 0:tty 0666
input/.* 0:0 0666
snd/.* 0:audio 0660
dri/.*|kgsl-3d0|ion|adsprpc-smd 0:gpu 0660
i2c-.*|gpiochip0|ttyHS0 0:gpio 0660
spidev.* 0:0 0666
ttyUSB.* 0:dialout 0660 */usr/comma/hotplug.py
sd[a-z].* 0:disk 0660 */usr/comma/hotplug.py
$SUBSYSTEM=(usb|gpio|backlight|leds|platform) 0:0 0660 */usr/comma/hotplug.py
.* 0:0 0660
