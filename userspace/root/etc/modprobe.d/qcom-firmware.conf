# qcom_q6v5_pas (ADSP) and venus_core load their firmware from the separately
# mounted modem partition, so qcom-firmware.service loads them after the mount.
# spectra_camera's firmware (CAMERA_ICP.elf) is in the rootfs and is only
# loaded when camerad acquires the ICP; the service loads the module too.
blacklist qcom_q6v5_pas
blacklist venus_core
blacklist spectra_camera
