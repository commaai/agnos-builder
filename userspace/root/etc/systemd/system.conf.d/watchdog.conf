# Reset the device if it hangs. On stock, the downstream msm_watchdog_v2
# driver pets the hardware watchdog from the kernel; mainline leaves that to
# userspace. The watchdog is the PM8998 PMIC watchdog (pm8916_wdt, up to
# 127 s), whose bite resets the PMIC directly. The pretimeout panics 10 s
# before the bite, so a hang leaves a pstore record, and the bite still
# resets if no CPU can panic. The kernel is built with WATCHDOG_NOWAYOUT,
# because systemd-shutdown disarms the watchdog right before reboot(): with
# it, the watchdog keeps counting through the kernel's own shutdown.
[Manager]
RuntimeWatchdogSec=30s
RuntimeWatchdogPreSec=10s
RuntimeWatchdogPreGovernor=panic
RebootWatchdogSec=30s
