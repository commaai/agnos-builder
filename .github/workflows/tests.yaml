name: tests
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  abctl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m unittest discover -s tests -p test_abctl.py -v

  precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: commaai/timeout@v1
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: pre-commit/action@v3.0.1
