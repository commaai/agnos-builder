name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build kernel and system
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: true

    - name: Get commit message
      run: |
        {
          echo 'LAST_COMMIT_MESSAGE<<EOF'
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "${{ github.event.head_commit.message }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_URL=$(echo "${{ github.event.repository.commits_url }}" | sed "s|{/sha}|/${{ github.sha }}|")
            echo "$(curl -s "$COMMIT_URL" | jq -r '.commit.message')"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_COMMIT_URL=$(echo "${{ github.event.repository.commits_url }}" | sed "s|{/sha}|/${{ github.event.pull_request.head.sha }}|")
            echo "$(curl -s "$PR_COMMIT_URL" | jq -r '.commit.message')"
          fi
          echo EOF
        } | tee -a $GITHUB_ENV

    - name: Get kernel submodule ref
      id: kernel-submodule
      run: echo "ref=$(git ls-tree HEAD | awk '$4 == "agnos-kernel-sdm845"' | awk '{print $3}')" | tee -a $GITHUB_OUTPUT

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-${{ github.run_id }}
        restore-keys: |
          ccache-kernel-${{ steps.kernel-submodule.outputs.ref }}-
          ccache-kernel-

    - name: Build agnos-meta-builder
      run: |
        docker buildx build --load -f Dockerfile.builder -t agnos-meta-builder . \
          --build-arg UNAME=$(id -nu) \
          --build-arg UID=$(id -u) \
          --build-arg GID=$(id -g)

    - name: Extract kernel UAPI headers
      run: |
        if git submodule status --cached agnos-kernel-sdm845/ | grep "^-"; then
          git submodule update --init agnos-kernel-sdm845
        fi
        cd agnos-kernel-sdm845
        make headers_install O=out ARCH=arm64 INSTALL_HDR_PATH=../output/linux-headers

    - name: Update VERSION
      if: github.event_name == 'pull_request'
      run: |
        echo -n $(cat userspace/root/VERSION)-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7) > userspace/root/VERSION

    - name: Build kernel and system
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_MAXSIZE: 5G
        GIT_HASH: ${{ github.event.pull_request.head.sha }}
      run: |
        ./build_kernel.sh &
        ./build_system.sh &
        wait

    - name: Statistics
      id: stats
      run: |
        {
          echo 'stats_summary<<EOF'
          scripts/analyze-agnos-rootfs.sh
          echo EOF
        } | tee -a $GITHUB_OUTPUT

    - name: Package and OTA push
      if: "contains(env.LAST_COMMIT_MESSAGE, '[upload]')"
      env:
        AGNOS_UPDATE_URL: https://gitlab.com/commaai/ci-artifacts/-/raw/agnos-builder/pr-${{ github.event.number }}
      run: |
        scripts/package_ota.py

    - name: Save PR number, VERSION and stats
      if: "contains(env.LAST_COMMIT_MESSAGE, '[upload]')"
      run: |
        echo ${{ github.event.number }} > output/ota/PR
        cp userspace/root/VERSION output/ota
        echo "${{ steps.stats.outputs.stats_summary }}" > output/ota/agnos_stats.txt

    - name: Upload artifacts
      if: "contains(env.LAST_COMMIT_MESSAGE, '[upload]')"
      uses: actions/upload-artifact@v4
      with:
        name: agnos-artifacts
        path: output/ota
        compression-level: 0
