name: lint

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  dockerfile-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - run: docker buildx build -f Dockerfile.agnos --check .
    - run: docker buildx build -f Dockerfile.builder --check . --build-arg UNAME=runner --build-arg UID=1001 --build-arg GID=1001
